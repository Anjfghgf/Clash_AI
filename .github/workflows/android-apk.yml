
name: Build CLASH AI Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q ClashAI_Android_GitHub_Build.zip -d android-project

      - name: Verify Android project
        run: |
          echo "Checking project files..."
          find android-project -maxdepth 4 -type f | head -80

          test -f android-project/ClashAI_Android/app/build.gradle.kts
          echo "Android project found successfully."

      - name: Fix Java and Kotlin compatibility
        working-directory: android-project/ClashAI_Android
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          // CLASH AI JVM compatibility fix
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build APK
        working-directory: android-project/ClashAI_Android
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CLASH-AI-Android-APK
          path: android-project/ClashAI_Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
