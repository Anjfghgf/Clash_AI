
name: Build CLASH AI Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q CLASH_AI_Android_GitHub_Build.zip -d android-project

      - name: Build APK
        working-directory: android-project/ClashAI_Android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clash-ai-debug-apk
          path: android-project/ClashAI_Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
